name: Run Paper Suggestions Bot

permissions:
  contents: write

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Installs feedparser to safely handle messy RSS XML
    - name: Install dependencies
      run: pip install feedparser

    - name: Run Python script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python send_papers.py

    - name: Commit updated posted list
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
    
        git add posted.json
    
        git diff --cached --quiet || git commit -m "Update posted papers"
    
        git push
